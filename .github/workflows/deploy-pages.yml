name: Deploy to GitHub Pages

# AR-Fight has no build step — the served site is the repo as-is (see
# README: "No app store, no build step, no accounts. Serve the folder and
# open it."). This workflow just publishes that folder to Pages on every
# push, so the deployed URL always matches the latest commit on this branch.

on:
  push:
    branches:
      - claude/mobile-ar-weapon-drawing-0fs367
  # Lets you trigger a redeploy manually from the Actions tab without
  # needing an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queuing behind it, so Pages always ends up on the latest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root: index.html expects ./src, ./vendor,
          # ./models alongside it. tools/ (dev server, tests) rides along
          # too — harmless to publish, nothing sensitive in it, and
          # excluding it would need a separate staging-copy step for no
          # real benefit.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
